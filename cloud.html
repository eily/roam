<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roam · Cloud</title><style>:root{color-scheme:dark;font:16px system-ui;background:#101216;color:#eee}main{max-width:700px;margin:auto;padding:24px}a,h1{color:#e3fb87}section{border:1px solid #343840;background:#1c2026;border-radius:16px;padding:18px;margin:16px 0}input,button{font:inherit;padding:10px;border-radius:8px;margin:6px 0}input{display:block;width:100%;box-sizing:border-box}button{background:#e3fb87;color:#151719;cursor:pointer;border:0}button:disabled{opacity:.45}p{line-height:1.5}#status{white-space:pre-wrap}</style><main><a href="./">← Roam</a><h1>Private cloud</h1><section><h2>Account</h2><form id="login"><label>Email<input type="email" id="email" autocomplete="email" required></label><label>Password<input type="password" id="password" autocomplete="current-password" minlength="8" required></label><button type="submit">Sign in</button><button type="button" id="signup">Create account</button></form><button id="logout" hidden>Sign out</button></section><section><h2>Back up this device</h2><p>Save existing Roam diary, Tokyo itinerary, settings and flights privately. Restore on another device when signed in. This is a manual snapshot, not automatic sync.</p><button id="upload" disabled>Save snapshot</button> <button id="restore" disabled>Restore latest snapshot</button><p id="status" role="status"></p></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const db=createClient('https://uahegtfsduznslldtvwb.supabase.co','sb_publishable_zrey2f-q5WZE8NU5DsFWqg_oE--rlKX',{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});const $=x=>document.getElementById(x),say=x=>$('status').textContent=x;let user=null;function show(u){user=u;$('login').hidden=!!u;$('logout').hidden=!u;$('upload').disabled=$('restore').disabled=!u}async function run(fn){try{await fn()}catch(e){say(e.message||String(e))}}$('login').onsubmit=e=>{e.preventDefault();run(async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)throw error;show(data.user);say('Signed in. Choose Save snapshot or Restore.')})};$('signup').onclick=()=>run(async()=>{if(!$('login').reportValidity())return;const {data,error}=await db.auth.signUp({email:$('email').value,password:$('password').value,options:{emailRedirectTo:location.origin+'/roam/cloud.html'}});$('password').value='';if(error)throw error;show(data.session?data.user:null);say(data.session?'Account created.':'Check your email to confirm your account, then return here and sign in.')});$('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;show(null);say('Signed out.')});$('upload').onclick=()=>run(async()=>{if(!user)return;const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('roam-'))data[k]=localStorage.getItem(k)}if(!Object.keys(data).length)throw Error('No local Roam data; restore instead.');const {error}=await db.from('legacy_backups').insert({user_id:user.id,record_key:crypto.randomUUID(),payload:{version:1,data}});if(error)throw error;say('Cloud snapshot saved: '+Object.keys(data).length+' data keys. Previous snapshots retained.')});$('restore').onclick=()=>run(async()=>{if(!user)return;const {data,error}=await db.from('legacy_backups').select('payload,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;if(!data)throw Error('No cloud snapshot found.');const entries=Object.entries(data.payload.data||{}).filter(([k,v])=>k.startsWith('roam-')&&typeof v==='string');if(!entries.length)throw Error('Snapshot empty.');if(!confirm('Restore snapshot from '+data.updated_at+'? Matching local data will be replaced. Export or save a backup first.'))return;for(const [k,v] of entries)localStorage.setItem(k,v);say('Restored '+entries.length+' data keys. Return to Roam.')});</script></html>
